# Service has no endpoints: its selector (app=checkut) does not match the pods (app=checkout).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: kubeiq-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: checkout}
  template:
    metadata:
      labels: {app: checkout}
    spec:
      containers:
        - name: web
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata:
  name: checkout
  namespace: kubeiq-demo
spec:
  selector: {app: checkut}
  ports: [{port: 80, targetPort: 80}]
