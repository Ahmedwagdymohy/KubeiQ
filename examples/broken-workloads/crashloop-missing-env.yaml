# CrashLoopBackOff: the app exits at startup because DATABASE_URL is not set.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment
  namespace: kubeiq-demo
spec:
  replicas: 2
  selector:
    matchLabels: {app: payment}
  template:
    metadata:
      labels: {app: payment}
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "payment-service v1.4.2 starting"
              echo "loading configuration"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: required environment variable DATABASE_URL is not set" >&2
                exit 1
              fi
              sleep 3600
          env:
            - name: LOG_LEVEL
              value: info
