# Init container crashes: it cannot resolve the database host, so the app never starts.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders
  namespace: kubeiq-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: orders}
  template:
    metadata:
      labels: {app: orders}
    spec:
      initContainers:
        - name: wait-for-db
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "waiting for postgres-orders:5432"
              nslookup postgres-orders >/dev/null 2>&1 || { echo "ERROR: could not resolve host postgres-orders: Name or service not known"; exit 1; }
      containers:
        - name: api
          image: busybox:1.36
          command: ["sleep", "3600"]
