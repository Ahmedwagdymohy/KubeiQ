# CreateContainerConfigError: the Secret exists but lacks the key the pod references.
apiVersion: v1
kind: Secret
metadata:
  name: billing-db
  namespace: kubeiq-demo
stringData:
  username: billing
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: kubeiq-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: billing}
  template:
    metadata:
      labels: {app: billing}
    spec:
      containers:
        - name: api
          image: busybox:1.36
          command: ["sleep", "3600"]
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: {name: billing-db, key: password}
