# Lets KubeiQ make the changes it offers in Cluster Manager, when an admin turns them on
# (ADR 0009). Every change also needs a KubeiQ admin or project editor and is audited.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubeiq-agent-changes
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubeiq-changes
subjects:
  - kind: ServiceAccount
    name: kubeiq-agent
    namespace: kubeiq-agent
